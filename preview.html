<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nikita Sychev — GitLab profile preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18171d;color:#ececef;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.frame{max-width:950px;margin:20px auto;border:1px solid #535158;border-radius:8px;overflow:hidden}.frame-header{height:41px;padding:10px 12px;background:#29282f;border-bottom:1px solid #535158;font-weight:600;display:flex;justify-content:space-between}.frame-header span:last-child{font-weight:400}.readme{padding:16px 24px 18px}.content{max-height:300px;overflow:hidden}.content>img{display:block;max-width:100%;height:auto;margin:0 0 16px}p{margin:0 0 16px}p img{max-width:100%;vertical-align:middle}a{color:#c4fa6a;text-decoration:none}summary{cursor:pointer}details>img{max-width:100%}.measure{max-width:950px;margin:14px auto;color:#9eb885;font-size:12px}details[open]{padding-bottom:8px}@media(max-width:600px){.frame{margin:12px}.readme{padding:12px}.measure{margin:12px}}
</style>
</head>
<body>
<section class="frame">
<header class="frame-header"><span>▣ README.md</span><span>Edit file</span></header>
<main class="readme"><div class="content" id="content">
<img src="./assets/header.svg" width="1200" alt="Nikita Sychev — Python, Data, Automation" />
<p>
<a href="https://t.me/sychnick182"><img src="./assets/telegram.svg" alt="Telegram" height="28" /></a>&nbsp;
<a href="mailto:n.e.sychev@yandex.ru"><img src="./assets/email.svg" alt="Email" height="28" /></a>&nbsp;
<a href="https://github.com/nikita-sychev182"><img src="./assets/github.svg" alt="Исходный профиль GitHub" height="28" /></a>
</p>
<details><summary>Активность на GitHub</summary><p>Статистика исходного профиля доступна при раскрытии блока.</p></details>
</div></main>
</section>
<p class="measure" id="measure"></p>
<script>window.addEventListener('load',()=>{const el=document.getElementById('content');const height=el.scrollHeight;document.getElementById('measure').textContent=`Высота содержимого: ${height} px / 300 px. ${height<=300?'Все основные элементы помещаются в рамку.':'Содержимое превышает высоту рамки.'}`;document.body.dataset.contentHeight=height;document.body.dataset.imagesLoaded=[...document.images].every(i=>i.complete&&i.naturalWidth>0);});</script>
</body>
</html>
